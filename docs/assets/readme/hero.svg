<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">MelindaOS</title>
  <desc id="d">MelindaOS, institutional intelligence for RSIA Melinda DHAI Kediri: governed hospital knowledge, the Director dashboard, and human authority. Source precedence in six ranks: live system, current regulation, canonical knowledge, playbook and policy, archive, external reference.</desc>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
    .sans { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="4" fill="#111418" stroke="#2D333B"/>

  <text class="sans" x="64" y="72" font-size="13" letter-spacing="2" fill="#9DA7B3">RSIA MELINDA DHAI · KEDIRI · INDONESIA</text>
  <text class="serif" x="60" y="166" font-size="84" fill="#E6EDF3">Melinda<tspan fill="#D0694F">OS</tspan></text>
  <text class="sans" x="64" y="208" font-size="19" fill="#9DA7B3">Governed hospital knowledge · Director dashboard · Human authority</text>
  <text class="serif" x="64" y="244" font-size="17" font-style="italic" fill="#9DA7B3">Fact becomes knowledge. Rule becomes policy. Uncertainty is escalated.</text>

  <line x1="770" y1="52" x2="770" y2="284" stroke="#2D333B"/>
  <g transform="translate(808 0)">
    <text class="sans" x="0" y="72" font-size="12" letter-spacing="2" fill="#9DA7B3">SOURCE PRECEDENCE</text>
    <g class="sans" font-size="15" fill="#E6EDF3">
      <text class="serif" x="0" y="106" fill="#D0694F">1</text><text x="28" y="106">Live system</text>
      <line x1="0" y1="116" x2="328" y2="116" stroke="#262C34"/>
      <text class="serif" x="0" y="140" fill="#9DA7B3">2</text><text x="28" y="140">Current regulation</text>
      <line x1="0" y1="150" x2="328" y2="150" stroke="#262C34"/>
      <text class="serif" x="0" y="174" fill="#9DA7B3">3</text><text x="28" y="174">Canonical knowledge</text>
      <line x1="0" y1="184" x2="328" y2="184" stroke="#262C34"/>
      <text class="serif" x="0" y="208" fill="#9DA7B3">4</text><text x="28" y="208">Playbook and policy</text>
      <line x1="0" y1="218" x2="328" y2="218" stroke="#262C34"/>
      <text class="serif" x="0" y="242" fill="#6E7681">5</text><text x="28" y="242" fill="#6E7681">Archive, context only</text>
      <line x1="0" y1="252" x2="328" y2="252" stroke="#262C34"/>
      <text class="serif" x="0" y="276" fill="#6E7681">6</text><text x="28" y="276" fill="#6E7681">External reference, never fact</text>
    </g>
  </g>

  <path fill="none" stroke="#E6EDF3" stroke-width="1.25" stroke-linejoin="round"
    d="M64 300 H210 l6 -4 l6 4 H250 l5 6 l8 -40 l8 50 l6 -16 H330 q12 -12 24 0 H420 l6 -4 l6 4 H460 l5 6 l8 -40 l8 50 l6 -16 H540 q12 -12 24 0 H620 V286 H650 V300 H668 V280 H708 V300 H724 V290 H752 V300"/>
  <text class="sans" x="64" y="324" font-size="11" letter-spacing="1.5" fill="#6E7681">CLINICAL SIGNAL → GOVERNED DATA</text>
</svg>
