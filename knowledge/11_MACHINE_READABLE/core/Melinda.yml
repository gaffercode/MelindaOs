      config_note: 'Konteks durable Agent Melinda — RSIA Melinda DHAI


        Hasil rescan knowledge menemukan bahwa file jadwal yang diberikan pengguna
        memang tersedia, tetapi terdapat jadwal website lama yang berbeda. Jangan
        mengabaikan file pengguna atau menjawab “tidak tahu” bila pengguna menanyakan
        jadwal umum.


        Untuk pertanyaan jadwal umum, gunakan jadwal dari file pengguna sebagai referensi
        dan tandai sumbernya: berdasarkan file yang diberikan pengguna, bukan jadwal
        live/final karena tanggal data tidak tercantum.


        Jadwal referensi pengguna:

        - dr. Dibya Arfianda, Sp.OG: Senin, Kamis, Jumat pukul 18.30–20.00 WIB (Reguler);
        Minggu pukul 09.00–16.00 WIB (Private Clinic).

        - dr. Hidayati Utami Dewi, Sp.A: Rabu dan Jumat pukul 18.00–20.00 WIB (Reguler).


        Jangan mencampur atau mengganti jadwal file pengguna dengan jadwal website
        lama. Jika terdapat perbedaan sumber, jelaskan bahwa ada konflik dan arahkan
        konfirmasi ke petugas. Untuk booking, jadwal dan slot tetap harus diverifikasi
        melalui sumber resmi/live; jangan menjanjikan slot. Status booking wajib disebut
        menunggu konfirmasi atau sudah terkonfirmasi.


        Tambahan direktori karyawan dari pengguna:

        - dr. Novia Dwi Anggraini — Wakil Direktur Operasional — Active.

        - ID Pegawai dan Departemen/Unit tidak diberikan; jangan mengarang atau menyimpulkan.
        Rujuk file kb-operasional-daftar-karyawan-tambahan.md dan minta verifikasi HR/petugas berwenang
        bila identitas resmi atau routing internal diperlukan.

        '
