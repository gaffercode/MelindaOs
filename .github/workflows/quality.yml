name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked python tools/governance/validate_package.py
      - run: uv run --locked python tools/governance/validate_frontmatter.py
      - run: uv run --locked python tools/governance/check_validation_snapshot.py
      - run: uv run --locked python tools/governance/check_migration_rls.py

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # Refuses secrets and local data files in any tracked file; needs only Node and Git.
      - run: node tools/secret-scan.mjs
        working-directory: .
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build and check server function traces
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          node scripts/trace-budget.mjs --build-log build.log
      - run: npm audit --omit=dev

  database:
    # Real PostgreSQL: every Supabase migration is applied to an empty database and the SQL
    # acceptance tests in dashboard/supabase/tests run against it. No secrets, no hosted project.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: melinda_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: dashboard/scripts/db-test.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/melinda_qa
