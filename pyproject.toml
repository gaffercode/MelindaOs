[project]
name = "melinda-knowledge-os"
version = "1.0.0"
description = "Canonical Knowledge Base, Clinical Safety Guardrails & Agentic Operating Architecture for RSIA Melinda DHAI"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
  "mcp>=2,<3",
  "reportlab>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4,<5",
]

[tool.pytest.ini_options]
cache_dir = "tests/.pytest_cache"
pythonpath = [
  "runtime/src",
  "tools",
]
testpaths = [
  "tests",
]
